services:
  mysql:
    image: mysql:8.0
    container_name: fastapi_tistory-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./.docker/mysql/data:/var/lib/mysql
      - ./.docker/mysql/my.cnf:/etc/mysql/mysql.conf.d/custom.cnf
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fastapi
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    networks:
      - local_network

  mongo:
    image: mongo:latest
    container_name: fastapi_tistory-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - ./.docker/mongo/data:/data/db
    ports:
      - "27017:27017"
    networks:
      - local_network

  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: fastapi_tistory
    volumes:
      - ./:/app
      - venv_data:/app/.venv
    ports:
      - "9095:8000"
      - "8888:8888"
    networks:
      - local_network
    environment:
      SERVICE_TYPE: app
      DB_HOST: fastapi_tistory-mysql
      MONGO_DB_HOST: fastapi_tistory-mongodb
      REDIS_URL: redis://fastapi_tistory-redis:6379/0

  redis:
    image: redis:7-alpine
    container_name: fastapi_tistory-redis
    command: redis-server --appendonly yes
    volumes:
      - ./.docker/redis/data:/data
    ports:
      - "6379:6379"
    networks:
      - local_network

  worker:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: fastapi_tistory-worker
    volumes:
      - ./:/app
      - venv_data:/app/.venv
    networks:
      - local_network
    environment:
      SERVICE_TYPE: worker
      DB_HOST: fastapi_tistory-mysql
      MONGO_DB_HOST: fastapi_tistory-mongodb
      REDIS_URL: redis://fastapi_tistory-redis:6379/0
    depends_on:
      - redis

volumes:
    venv_data:

networks:
  local_network:
    driver: bridge